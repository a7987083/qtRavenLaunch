name: Build RavenLaunch CN Generator

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/cn_generator_core.py'
      - 'tools/cn_generator_gui.py'
      - 'tests/test_cn_generator.py'
      - 'tests/test_translation_collector.py'
      - 'tools/translation_collector.py'
      - 'tools/extract_strings.py'
      - 'tools/translation_diagnostics.py'
      - 'tests/test_translation_diagnostics.py'
      - 'tests/test_extract_strings.py'
      - 'translations/zh_CN.json'
      - '.github/workflows/build-cn-generator.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install packager
        run: python -m pip install pyinstaller==6.22.3
      - name: Syntax and generator tests
        shell: pwsh
        run: |
          python -m compileall -q tools/cn_generator_core.py tools/cn_generator_gui.py tools/translation_collector.py tools/extract_strings.py tools/translation_diagnostics.py tests/test_cn_generator.py tests/test_translation_collector.py tests/test_extract_strings.py tests/test_translation_diagnostics.py
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build standalone generator
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --add-data "translations/zh_CN.json;translations" --name RavenLaunch-CN-Generator tools/cn_generator_gui.py
      - name: Verify built EXE
        shell: pwsh
        run: |
          if (!(Test-Path dist/RavenLaunch-CN-Generator.exe)) { throw 'Generator EXE missing' }
          Get-FileHash dist/RavenLaunch-CN-Generator.exe -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: RavenLaunch-CN-Generator-Windows
          path: dist/RavenLaunch-CN-Generator.exe
          retention-days: 30
